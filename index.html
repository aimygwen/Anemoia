<script>
(function () {
  function syncScreenMetrics() {
    var h = window.innerHeight || document.documentElement.clientHeight || 0;
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    var root = document.documentElement;
    if (!h) return;
    root.style.setProperty("--vh", h * 0.01 + "px");
    root.style.setProperty("--pk-screen-h", h + "px");
    root.style.setProperty("--pk-screen-w", w + "px");
  }

  syncScreenMetrics();
  window.addEventListener("resize", syncScreenMetrics, { passive: true });
  window.addEventListener("orientationchange", syncScreenMetrics, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncScreenMetrics, { passive: true });
  }
})();
</script>
<script>
(function () {
  function siteBaseFromPath(path) {
    var spaViews = ["work", "insights", "me", "contact", "imprint", "start"];
    path = (path || "/").replace(/\/index\.html$/i, "");
    var segments = path.split("/").filter(Boolean);
    var cutIdx = segments.length;
    var i;

    for (i = 0; i < segments.length; i++) {
      if (spaViews.indexOf(segments[i].toLowerCase()) !== -1) {
        cutIdx = i;
        break;
      }
    }

    if (cutIdx === 0) return "/";
    if (cutIdx < segments.length) {
      return "/" + segments.slice(0, cutIdx).join("/") + "/";
    }

    if (segments.length && /\.html$/i.test(segments[segments.length - 1])) {
      if (segments.length === 1) return "/";
      return "/" + segments.slice(0, -1).join("/") + "/";
    }

    return "/";
  }

  var baseHref = siteBaseFromPath(location.pathname);
  var baseEl = document.createElement("base");
  baseEl.href = baseHref;
  document.head.appendChild(baseEl);
  window.__aimySiteBase = baseHref;
})();
</script>
<script>
(function () {
  function restoreSpaUrl(pathname, search, hash) {
    if (!pathname || pathname === "/" || /\/index\.html$/i.test(pathname)) return false;
    try {
      history.replaceState(null, "", pathname + (search || "") + (hash || ""));
      return true;
    } catch (e) {
      return false;
    }
  }

  var params = new URLSearchParams(location.search);
  var qp = params.get("redirect");
  if (qp) {
    try {
      var qpUrl = qp.charAt(0) === "/" ? new URL(qp, location.origin) : new URL("/" + qp, location.origin);
      restoreSpaUrl(qpUrl.pathname, qpUrl.search, qpUrl.hash);
    } catch (e) {}
  }

  var stored = sessionStorage.getItem("aimySpaRedirect");
  if (stored) {
    try {
      var storedUrl = new URL(stored, location.origin);
      restoreSpaUrl(storedUrl.pathname, storedUrl.search, storedUrl.hash);
    } catch (e) {}
  }
})();
</script>
