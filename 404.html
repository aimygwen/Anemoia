<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    (function () {
      function siteBaseFromPath(path) {
        var spaViews = ["work", "insights", "me", "contact", "imprint", "start"];
        path = (path || "/").replace(/\/index\.html$/i, "");
        var segments = path.split("/").filter(Boolean);
        var cutIdx = segments.length;
        var i;

        for (i = 0; i < segments.length; i++) {
          if (spaViews.indexOf(segments[i].toLowerCase()) !== -1) {
            cutIdx = i;
            break;
          }
        }

        if (cutIdx === 0) return "/";
        if (cutIdx < segments.length) {
          return "/" + segments.slice(0, cutIdx).join("/") + "/";
        }

        if (segments.length && /\.html$/i.test(segments[segments.length - 1])) {
          if (segments.length === 1) return "/";
          return "/" + segments.slice(0, -1).join("/") + "/";
        }

        return "/";
      }

      var path = window.location.pathname || "";
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var base = siteBaseFromPath(path);
      var leaf = path.replace(/\/+$/, "").split("/").pop().toLowerCase();
      try {
        sessionStorage.setItem("aimySpaRedirect", location.href);
      } catch (e) {}
      var target = path + search + hash;
      var redirect =
        target && target !== "/" && !/\/index\.html$/i.test(target)
          ? "?redirect=" + encodeURIComponent(target)
          : "";
      window.location.replace(base + "index.html" + redirect);
    })();
  </script>
</head>
<body></body>
</html>
